# Weekly COVID-19 and RSV hub runs of DMAPRIME-HYB (automation/resp_submit.py) on GitHub Actions, one job per hub.
#
# Independent of the FluSight and MetroCast runs: its own switch, records and concurrency groups.
# Scheduled and workflow_run runs only work from the default branch and do nothing unless the repository
# variable RESP_MODE is set:
#   shadow  forecast and check the file only (resp_submit --no-upload); nothing is uploaded
#   submit  forecast, check, sync the fork, upload and open the PR
#   gh variable set RESP_MODE -b submit -R <owner>/<repo>
# Secrets: RESP_FORK_TOKEN (write access to DMA-PRIME/covid19-forecast-hub and DMA-PRIME/rsv-forecast-hub;
# falls back to FORK_TOKEN when that token covers them), PR_TOKEN (opens the PRs; its account must be in the
# model metadata's designated_github_users for the hubs to merge them automatically).
#
# Triggers: every 20 minutes on Wednesdays and Thursdays (data usually come on Wednesday, a day later in
# holiday weeks; submissions are due Wednesday 23:00 ET, and the file check refuses a file outside the
# hub's submission window), after every completed weekly-metrocast or weekly-flusight run (the MetroCast
# run is started by hand on Wednesday afternoons, and GitHub's schedule is unreliable), and by hand.
# A quick check (automation/resp_ready.py, standard library only) stops in seconds when this week is done
# or the hub's data have not changed since Monday.
#
# Each run's record (submission file, data snapshot, run.json, runner.txt) is committed to the branch
# runs-<hub> (submit) or runs-<hub>-shadow (shadow), created on first use and checked out as
# outputs/<hub>/pooled_hyb/submissions, so "this week already run" works across runs.
# Exit code 2 from resp_submit (no new data yet, or this week already done) counts as success.
# Notification: an issue in NOTIFY_REPO (as for FluSight) when a run succeeds or fails.
#
# Manual runs: gh workflow run weekly_resp.yml -R <owner>/<repo> -f mode=submit [-f hub=covid] [-f force=true]
name: weekly-resp

on:
  schedule:
    - cron: '7,27,47 14-23 * * 3,4'
    - cron: '7,27,47 0-2 * * 4,5'
  workflow_run:
    workflows: [weekly-metrocast, weekly-flusight]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [shadow, submit]
        default: shadow
      hub:
        type: choice
        options: [both, covid, rsv]
        default: both
      force:
        description: skip the checks on the repository, data and this week's run
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || vars.RESP_MODE == 'shadow' || vars.RESP_MODE == 'submit'
    strategy:
      fail-fast: false
      matrix:
        hub: ${{ fromJSON(inputs.hub == 'covid' && '["covid"]' || inputs.hub == 'rsv' && '["rsv"]' || '["covid", "rsv"]') }}
    concurrency:
      group: weekly-resp-${{ matrix.hub }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      HUB: ${{ matrix.hub }}
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || vars.RESP_MODE }}
      FORCE: ${{ inputs.force == true }}
      RUNS_DIR: outputs/${{ matrix.hub }}/pooled_hyb/submissions
      RUN_BRANCH: ${{ github.event.repository.default_branch }}
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v7

      - name: Check out the run records
        run: |
          RUNS_BRANCH="runs-$HUB$([ "$MODE" = submit ] || echo -shadow)"
          echo "RUNS_BRANCH=$RUNS_BRANCH" >> "$GITHUB_ENV"
          if git ls-remote --exit-code --heads origin "$RUNS_BRANCH" >/dev/null; then
            git fetch -q --depth 1 origin "$RUNS_BRANCH"
            git worktree add -q "$RUNS_DIR" FETCH_HEAD
          else
            git worktree add -q --detach "$RUNS_DIR"
            git -C "$RUNS_DIR" checkout -q --orphan "$RUNS_BRANCH"
            git -C "$RUNS_DIR" rm -rfq .
          fi

      - name: Quick check
        id: ready
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$FORCE" = true ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          set +e
          python3 automation/resp_ready.py "$HUB" --runs-dir "$RUNS_DIR"
          rc=$?
          set -e
          if [ $rc -eq 0 ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ $rc -eq 2 ]; then echo "ready=false" >> "$GITHUB_OUTPUT"
          else exit $rc; fi

      - if: steps.ready.outputs.ready != 'false'
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.2'
          cache: pip
          cache-dependency-path: .github/workflows/weekly_resp.yml

      # Pinned versions (as in the FluSight and MetroCast runs)
      - name: Install
        if: steps.ready.outputs.ready != 'false'
        run: |
          pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==2.4.1 pandas==2.3.3 pyarrow==22.0.0

      - name: Runner
        if: steps.ready.outputs.ready != 'false'
        run: |
          {
            echo "cpu: $(lscpu | sed -n 's/^Model name: *//p')"
            echo "torch_cpu_capability: $(python -c 'import torch; print(torch.backends.cpu.get_cpu_capability())')"
            echo "image: $ImageOS $ImageVersion"
          } | tee "$RUNNER_TEMP/runner.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: resp_submit
        id: submit
        if: steps.ready.outputs.ready != 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.RESP_FORK_TOKEN || secrets.FORK_TOKEN }}
          PR_TOKEN: ${{ secrets.PR_TOKEN }}
        run: |
          args="$HUB"
          if [ "$MODE" = shadow ]; then args="$args --no-upload"; fi
          if [ "$FORCE" = true ]; then args="$args --force"; fi
          echo "mode=$MODE args=$args"
          set +e
          python -m automation.resp_submit $args
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/summary.md" || true
          if [ $rc -ne 0 ] && [ $rc -ne 2 ]; then exit $rc; fi

      - name: Save the run record
        if: always() && steps.ready.outputs.ready != 'false'
        run: |
          cd "$RUNS_DIR"
          for d in $(git status --porcelain --untracked-files=all | awk '{print $2}' | grep -oE '^[0-9]{4}-[0-9]{2}-[0-9]{2}/' | sort -u); do
            cp "$RUNNER_TEMP/runner.txt" "$d"
          done
          git add -A
          if git diff --cached --quiet; then echo 'no new run record'; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "$MODE run $(date -u +%Y-%m-%dT%H:%MZ) from ${GITHUB_REF_NAME}@${GITHUB_SHA::7}"
          git push origin "HEAD:$RUNS_BRANCH"

      - name: Notify (issue)
        # outcome first: a skipped step's rc is null, and null == '0' is true in GitHub expressions
        if: always() && ((steps.submit.outcome == 'success' && steps.submit.outputs.rc == '0') || failure())
        env:
          GH_TOKEN: ${{ secrets.NOTIFY_TOKEN || github.token }}
          NOTIFY_REPO: ${{ vars.NOTIFY_REPO || github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          body="$RUNNER_TEMP/issue.md"
          cat "$RUNNER_TEMP/summary.md" > "$body" 2>/dev/null || true
          printf '\nRun: %s\n' "$RUN_URL" >> "$body"
          ref=$(grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}-DMAPRIME' "$body" | head -1 | cut -c1-10)
          if [ "$JOB_STATUS" != success ]; then status=FAILED; else status=$(grep -m1 '^## resp_submit' "$body" | sed 's/^## resp_submit [a-z]*: //'); fi
          gh issue create -R "$NOTIFY_REPO" --assignee "$GITHUB_REPOSITORY_OWNER" \
            --title "[$HUB $MODE] $status ${ref} ($(date -u +%Y-%m-%d))" --body-file "$body"

      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.hub }}
          path: outputs/${{ matrix.hub }}/pooled_hyb/logs/
          if-no-files-found: ignore
          retention-days: 30
