# Weekly FluSight run of DMAPRIME-HYB (automation/auto_submit.py) on GitHub Actions.
#
# Scheduled runs only work from the default branch and do nothing unless the repository variable
# WEEKLY_MODE is set:
#   shadow  forecast and check the file only (auto_submit --no-upload); nothing is uploaded
#   submit  forecast, check, sync the fork, upload and open the PR (needs secrets FORK_TOKEN, PR_TOKEN)
# Unset (or anything else): scheduled runs are skipped.
#   gh variable set WEEKLY_MODE -b shadow -R <owner>/<repo>
#
# The ED target comes from the DMAPRIME-ObsHYB networks of this week's MetroCast run (config
# ed_model, automation/flusight_ed.py): a submission waits for that run's record until 21:00 ET.
#
# Each run's record (submission file, data snapshot, run.json) is committed to the branch `runs-flusight`
# (submit) or `runs-flusight-shadow` (shadow), which is checked out as outputs/flusight/pooled_hyb/submissions,
# so the "this week already run" check works across the scheduled runs.
# Exit code 2 from auto_submit (no new data yet, or this week already done) counts as success;
# any other failure fails the run. Notification: when auto_submit succeeds (exit 0) or the run fails,
# an issue is opened in the repository variable NOTIFY_REPO (default: this repository; secret
# NOTIFY_TOKEN when it is another one) with the summary and a link to the run.
#
# Manual runs: gh workflow run weekly_flusight.yml -R <owner>/<repo> -f mode=shadow [-f force=true]
# Training is deterministic on a given CPU but not across CPUs (GitHub's runners are AMD EPYC 7763,
# AMD EPYC 9V45 or Intel Xeon 8370C and cannot be chosen). Each record therefore gets runner.txt
# (CPU, torch kernel level, image), and a recorded week can be rerun and compared:
#   gh workflow run weekly_flusight.yml -R <owner>/<repo> -f mode=submit -f reproduce=2026-10-17
# (checks out the commit in that week's run.json, reruns it from its snapshot and compares with
# automation/compare_submissions.py: identical on the same CPU, within tolerance on another one;
# mode picks the record branch: submit -> runs-flusight, shadow -> runs-flusight-shadow)
name: weekly-flusight

on:
  schedule:
    # Every 20 minutes on Wednesdays, 12:07-22:47 EDT / 11:07-21:47 EST (cron is UTC). GitHub delays and
    # drops scheduled runs under load (Oct 7: 2 of 7 hourly triggers ran, one 3 hours late), hence many.
    - cron: '7,27,47 16-23 * * 3'
    - cron: '7,27,47 0-2 * * 4'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [shadow, submit]
        default: shadow
      force:
        description: skip the checks on the repository, data and this week's run
        type: boolean
        default: false
      reproduce:
        description: reference date of a recorded run to rerun and compare (nothing is uploaded or saved)
        type: string
        default: ''

concurrency:
  group: weekly-flusight
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  run:
    if: github.event_name != 'schedule' || vars.WEEKLY_MODE == 'shadow' || vars.WEEKLY_MODE == 'submit'
    runs-on: ubuntu-24.04  # pinned OS image (results also depend on the runner's CPU, see above)
    timeout-minutes: 120
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || vars.WEEKLY_MODE }}
      FORCE: ${{ inputs.force == true }}
      REPRODUCE: ${{ inputs.reproduce }}
      RUNS_DIR: outputs/flusight/pooled_hyb/submissions
      RUN_BRANCH: ${{ github.event.repository.default_branch }}
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v7

      - name: Check out the run records
        uses: actions/checkout@v7
        with:
          ref: ${{ env.MODE == 'submit' && 'runs-flusight' || 'runs-flusight-shadow' }}
          path: ${{ env.RUNS_DIR }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.2'
          cache: pip
          cache-dependency-path: .github/workflows/weekly_flusight.yml

      # Pinned versions, so the runs are reproducible
      - name: Install
        run: |
          pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==2.4.1 pandas==2.3.3

      - name: Runner
        run: |
          {
            echo "cpu: $(lscpu | sed -n 's/^Model name: *//p')"
            echo "torch_cpu_capability: $(python -c 'import torch; print(torch.backends.cpu.get_cpu_capability())')"
            echo "image: $ImageOS $ImageVersion"
          } | tee "$RUNNER_TEMP/runner.txt" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/runner.txt"

      - name: Reproduce a recorded run
        if: env.REPRODUCE != ''
        run: |
          dir="$RUNS_DIR/$REPRODUCE"
          cp automation/compare_submissions.py "$RUNNER_TEMP/"   # the recorded commit may predate it
          echo "recorded on:"; cat "$dir/runner.txt" 2>/dev/null || echo '(no runner.txt)'
          echo "now on:"; cat "$RUNNER_TEMP/runner.txt"
          commit=$(python -c "import json; print(json.load(open('$dir/run.json'))['git_commit'])")
          git fetch -q --depth 1 origin "$commit"
          git checkout -q --detach "$commit"
          python -m dmaprime.forecast --reproduce "$REPRODUCE"
          original="$dir/$(python -c "import json; print(json.load(open('$dir/run.json'))['submission']['file'])")"
          rerun=$(find "$dir/reproduce" -name '*.csv' | head -1)
          # ED rows from DMAPRIME-ObsHYB (automation/flusight_ed.py): apply the recorded file
          if [ -f "$dir/obshyb_ed.csv" ]; then python -m automation.flusight_ed "$rerun" "$dir/obshyb_ed.csv" "$dir/data"; fi
          python "$RUNNER_TEMP/compare_submissions.py" "$original" "$rerun" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: auto_submit
        id: submit
        if: env.REPRODUCE == ''
        env:
          GITHUB_TOKEN: ${{ secrets.FORK_TOKEN }}
          GITHUB_REPO: DMA-PRIME/FluSight-forecast-hub
          GITHUB_BRANCH: main
          PR_TOKEN: ${{ secrets.PR_TOKEN }}
        run: |
          args="--no-email"
          if [ "$MODE" = shadow ]; then args="$args --no-upload"; fi
          if [ "$FORCE" = true ]; then args="$args --force"; fi
          echo "mode=$MODE args=$args"
          set +e
          python -m automation.auto_submit $args
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/summary.md" || true
          if [ $rc -ne 0 ] && [ $rc -ne 2 ]; then exit $rc; fi

      - name: Save the run record
        if: always() && env.REPRODUCE == ''
        run: |
          cd "$RUNS_DIR"
          for d in $(git status --porcelain --untracked-files=all | awk '{print $2}' | grep -oE '^[0-9]{4}-[0-9]{2}-[0-9]{2}/' | sort -u); do
            cp "$RUNNER_TEMP/runner.txt" "$d"
          done
          git add -A
          if git diff --cached --quiet; then echo 'no new run record'; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "$MODE run $(date -u +%Y-%m-%dT%H:%MZ) from ${GITHUB_REF_NAME}@${GITHUB_SHA::7}"
          git push origin HEAD:${{ env.MODE == 'submit' && 'runs-flusight' || 'runs-flusight-shadow' }}

      - name: Notify (issue)
        # outcome first: a skipped step's rc is null, and null == '0' is true in GitHub expressions
        if: always() && ((steps.submit.outcome == 'success' && steps.submit.outputs.rc == '0') || failure())
        env:
          GH_TOKEN: ${{ secrets.NOTIFY_TOKEN || github.token }}
          NOTIFY_REPO: ${{ vars.NOTIFY_REPO || github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          body="$RUNNER_TEMP/issue.md"
          cat "$RUNNER_TEMP/summary.md" > "$body" 2>/dev/null || true
          printf '\nRun: %s\n' "$RUN_URL" >> "$body"
          ref=$(grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}-DMAPRIME' "$body" | head -1 | cut -c1-10)
          if [ "$JOB_STATUS" != success ]; then status=FAILED; else status=$(head -1 "$body" | sed 's/^## auto_submit: //'); fi
          gh issue create -R "$NOTIFY_REPO" --assignee "$GITHUB_REPOSITORY_OWNER" \
            --title "[$MODE] $status ${ref:-$REPRODUCE} ($(date -u +%Y-%m-%d))" --body-file "$body"

      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs
          path: outputs/flusight/pooled_hyb/logs/
          if-no-files-found: ignore
          retention-days: 30
