# Weekly Flu MetroCast run of DMAPRIME-ObsHYB on GitHub Actions.
#
# Three jobs (automation/metrocast_weekly.py):
#   prepare  a quick check first (automation/metrocast_ready.py, standard library only: this week not run
#            yet, hub data through the last Saturday; otherwise the run stops here in seconds), then
#            the full checks (repository on its default branch and clean, the same two, the fork has
#            no file for it yet) and data sync; the data and the list of networks to train (config
#            seeds x early-stopping modes) go to the next jobs
#   train    a matrix: one runner per network, all in parallel; each network also forecasts every
#            state's NSSP series for the FluSight ED target
#   combine  averages the networks, draws the 100 trajectories, writes and checks the Parquet file
#            and flusight_ed.csv (read by the FluSight run), syncs the fork, uploads the file and
#            opens the PR; saves the run record and opens an issue
# The result equals the single-process `python -m dmaprime.forecast --hub metrocast --model pooled_obshyb`
# on one machine; here each network may run on a different CPU (recorded in run.json, `parts`).
#
# Scheduled runs only work from the default branch and do nothing unless the repository variable
# METROCAST_MODE is set (independent of FluSight's WEEKLY_MODE):
#   shadow  forecast and check only; nothing is uploaded
#   submit  forecast, check, sync the fork, upload and open the PR (secrets FORK_TOKEN, PR_TOKEN)
#   gh variable set METROCAST_MODE -b shadow -R <owner>/<repo>
#
# Run records (submission, data snapshot, run.json) go to the branch `runs-metrocast` (submit) or
# `runs-metrocast-shadow` (shadow), created on first use and checked out as
# outputs/metrocast/pooled_obshyb/submissions, so "this week already run" works across runs.
# Exit code 2 from prepare (no new data yet, or this week already done) skips the rest quietly;
# a failure fails the run. Notification: an issue in NOTIFY_REPO (as for FluSight) when a run
# uploads (or, in shadow mode, checks) a file, or when a run fails.
#
# Manual runs: gh workflow run weekly_metrocast.yml -R <owner>/<repo> -f mode=shadow [-f force=true]
name: weekly-metrocast

on:
  schedule:
    # Every 20 minutes on Wednesdays, 12:07-20:27 EDT / 11:07-19:27 EST (cron is UTC).
    # Data are often released before 14:00 ET; submissions are due at 20:00 ET; a run takes about 20 minutes.
    - cron: '7,27,47 16-23 * * 3'
    - cron: '7,27 0 * * 4'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [shadow, submit]
        default: shadow
      force:
        description: skip the checks on the repository, data and this week's run
        type: boolean
        default: false

concurrency:
  group: weekly-metrocast
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || vars.METROCAST_MODE }}
  FORCE: ${{ inputs.force == true }}
  RUNS_DIR: outputs/metrocast/pooled_obshyb/submissions
  RUN_BRANCH: ${{ github.event.repository.default_branch }}
  RUNS_BRANCH: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode || vars.METROCAST_MODE) == 'submit' && 'runs-metrocast' || 'runs-metrocast-shadow' }}
  OMP_NUM_THREADS: '4'

jobs:
  prepare:
    if: github.event_name != 'schedule' || vars.METROCAST_MODE == 'shadow' || vars.METROCAST_MODE == 'submit'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      go: ${{ steps.prepare.outputs.go }}
      plan: ${{ steps.prepare.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
      - &records
        name: Check out the run records
        run: |
          if git ls-remote --exit-code --heads origin "$RUNS_BRANCH" >/dev/null; then
            git fetch -q --depth 1 origin "$RUNS_BRANCH"
            git worktree add -q "$RUNS_DIR" FETCH_HEAD
          else
            git worktree add -q --detach "$RUNS_DIR"
            git -C "$RUNS_DIR" checkout -q --orphan "$RUNS_BRANCH"
            git -C "$RUNS_DIR" rm -rfq .
          fi
      # Before installing anything: stop quietly when this week is already done or its data are not
      # out yet (standard library only, about 1 MB; the full download is about 50 MB)
      - name: Quick check
        id: ready
        run: |
          if [ "$FORCE" = true ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          set +e
          python3 automation/metrocast_ready.py
          rc=$?
          set -e
          if [ $rc -eq 0 ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ $rc -eq 2 ]; then echo "ready=false" >> "$GITHUB_OUTPUT"
          else exit $rc; fi
      # The next two steps are reused in train and combine, which have no Quick check: there
      # steps.ready is empty, so the condition holds
      - &python
        if: steps.ready.outputs.ready != 'false'
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.2'
          cache: pip
          cache-dependency-path: .github/workflows/weekly_metrocast.yml
      # Pinned versions (as in the FluSight runs)
      - &install
        name: Install
        if: steps.ready.outputs.ready != 'false'
        run: |
          pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==2.4.1 pandas==2.3.3 scipy==1.17.0 pyarrow==22.0.0
      - name: prepare
        id: prepare
        if: steps.ready.outputs.ready != 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.FORK_TOKEN }}
          METROCAST_REPO: DMA-PRIME/flu-metrocast
        run: |
          args=""
          if [ "$MODE" = shadow ]; then args="$args --no-upload"; fi
          if [ "$FORCE" = true ]; then args="$args --force"; fi
          echo "mode=$MODE args=$args"
          set +e
          python -m automation.metrocast_weekly prepare $args
          rc=$?
          set -e
          if [ $rc -eq 0 ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "plan=$(cat outputs/metrocast/pooled_obshyb/parts/plan.json)" >> "$GITHUB_OUTPUT"
          fi
          if [ $rc -ne 0 ] && [ $rc -ne 2 ]; then exit $rc; fi
      - name: Upload the data
        if: steps.prepare.outputs.go == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: metrocast-data
          path: data/metrocast/
          retention-days: 7
      - &logs
        name: Upload the log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ github.job }}${{ matrix.val && format('-{0}-s{1}', matrix.val, matrix.seed) || '' }}
          path: outputs/metrocast/pooled_obshyb/logs/
          if-no-files-found: ignore
          retention-days: 30

  train:
    needs: prepare
    if: needs.prepare.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.plan) }}
    steps:
      - uses: actions/checkout@v7
      - *python
      - *install
      - uses: actions/download-artifact@v7
        with:
          name: metrocast-data
          path: data/metrocast/
      - name: train
        run: python -m automation.metrocast_weekly train --val "${{ matrix.val }}" --seed "${{ matrix.seed }}"
      - uses: actions/upload-artifact@v7
        with:
          name: part-${{ matrix.val }}-s${{ matrix.seed }}
          path: outputs/metrocast/pooled_obshyb/parts/part_*
          retention-days: 7
      - *logs

  combine:
    needs: [prepare, train]
    if: needs.prepare.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - *records
      - *python
      - *install
      - uses: actions/download-artifact@v7
        with:
          name: metrocast-data
          path: data/metrocast/
      - uses: actions/download-artifact@v7
        with:
          pattern: part-*
          merge-multiple: true
          path: outputs/metrocast/pooled_obshyb/parts/
      - name: combine
        id: combine
        env:
          GITHUB_TOKEN: ${{ secrets.FORK_TOKEN }}
          METROCAST_REPO: DMA-PRIME/flu-metrocast
          PR_TOKEN: ${{ secrets.PR_TOKEN }}
        run: |
          args=""
          if [ "$MODE" = shadow ]; then args="$args --no-upload"; fi
          if [ "$FORCE" = true ]; then args="$args --force"; fi
          set +e
          python -m automation.metrocast_weekly combine $args
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/summary.md" || true
          exit $rc
      - name: Save the run record
        if: always()
        run: |
          cd "$RUNS_DIR"
          git add -A
          if git diff --cached --quiet; then echo 'no new run record'; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "$MODE run $(date -u +%Y-%m-%dT%H:%MZ) from ${GITHUB_REF_NAME}@${GITHUB_SHA::7}"
          git push origin "HEAD:refs/heads/$RUNS_BRANCH"
      - *logs

  notify:
    needs: [prepare, train, combine]
    # an upload or shadow check that went through, or any failure
    if: always() && (needs.combine.result == 'success' || contains(needs.*.result, 'failure'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: logs-*
          path: logs/
        continue-on-error: true
      - name: Notify (issue)
        env:
          GH_TOKEN: ${{ secrets.NOTIFY_TOKEN || github.token }}
          NOTIFY_REPO: ${{ vars.NOTIFY_REPO || github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED: ${{ contains(needs.*.result, 'failure') }}
        run: |
          body="$RUNNER_TEMP/issue.md"
          tail -n 15 logs/logs-combine/metrocast_submit.log > "$body" 2>/dev/null || echo '(no combine log)' > "$body"
          printf '\nJobs: prepare %s, train %s, combine %s\nRun: %s\n' \
            "${{ needs.prepare.result }}" "${{ needs.train.result }}" "${{ needs.combine.result }}" "$RUN_URL" >> "$body"
          ref=$(grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}-DMAPRIME' "$body" | head -1 | cut -c1-10)
          if [ "$FAILED" = true ]; then status=FAILED; else status=OK; fi
          gh issue create -R "$NOTIFY_REPO" --assignee "$GITHUB_REPOSITORY_OWNER" \
            --title "[metrocast $MODE] $status ${ref} ($(date -u +%Y-%m-%d))" --body-file "$body"
